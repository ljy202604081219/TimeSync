# 本地 PostgreSQL 验证环境（③ 的 B1 验收用）。仅用于开发机，不要用于生产。
#
#   docker compose up -d db
#   export DATABASE_URL='postgresql+psycopg://timesync:timesync@127.0.0.1:5432/timesync'
#   cd backend && python -m app.migrate && python -m app.bootstrap --fixtures
#   TIMESYNC_TEST_DATABASE_URL="$DATABASE_URL" python -m pytest -q
#
# 该测试库会被测试用例 drop/create，切勿指向云端真实库。
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: timesync
      POSTGRES_PASSWORD: timesync
      POSTGRES_DB: timesync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesync -d timesync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - timesync-pg:/var/lib/postgresql/data

volumes:
  timesync-pg:
